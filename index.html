<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PERIHELION · Interactive Planetarium</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='7' fill='%236fd6ff'/%3E%3Cellipse cx='16' cy='16' rx='14' ry='5' fill='none' stroke='%236fd6ff' stroke-opacity='.5' transform='rotate(-20 16 16)'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app"></div>
  <div id="labels"></div>
  <div id="ui-root"></div>

  <div id="splash">
    <div class="splash-card">
      <h1>PERIHELION</h1>
      <p class="tag">interactive planetarium</p>
      <div id="splash-status">initialising…</div>
    </div>
  </div>

  <script>
    /* surface early load errors on the splash screen */
    window.addEventListener('error', function (e) {
      var s = document.getElementById('splash-status');
      if (s && !document.getElementById('splash').classList.contains('done')) {
        s.textContent = 'error: ' + (e.message || 'script failed to load');
        s.className = 'err';
      }
    });
  </script>
  <script src="js/three.min.js"></script>
  <script src="js/data.js"></script>
  <script src="js/stars-hip.js"></script>
  <script src="js/stars-named.js"></script>
  <script src="js/dso.js"></script>
  <script src="js/dso2.js"></script>
  <script src="js/asterisms.js"></script>
  <script src="js/minors.js"></script>
  <script src="js/probes.js"></script>
  <script src="js/planets-textures.js"></script>
  <script src="js/astro.js"></script>
  <script src="js/sky.js"></script>
  <script src="js/solar.js"></script>
  <script src="js/cities.js"></script>
  <script src="js/scenarios.js"></script>
  <script src="js/journey.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
  <script src="demo-record.js"></script>
</body>
</html>
